name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Type / Format
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        env:
          PYTHONWARNINGS: error
        run: pytest --cov=src --cov-report=term-missing --cov-report=json:coverage.json

      - name: Upload coverage (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main
          path: coverage.json

      - name: Fetch main branch
        run: |
          git fetch origin main
          git worktree add ../main-worktree origin/main

      - name: Install dependencies (main)
        working-directory: ../main-worktree
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests on main (coverage only)
        working-directory: ../main-worktree
        run: pytest --cov=src --cov-report=json:coverage_main.json

      - name: Compare coverage with main
        run: |
          python scripts/check_coverage.py --compare coverage.json ../main-worktree/coverage_main.json
