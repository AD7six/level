name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Type / Format
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        env:
          PYTHONWARNINGS: error
        run: pytest --cov=src --cov-report=term-missing --cov-report=json:coverage.json

      - name: Fetch main branch
        run: |
          git fetch origin main
          git worktree add ../main-worktree origin/main

      - name: Install dependencies (main)
        working-directory: ../main-worktree
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests on main (coverage only)
        working-directory: ../main-worktree
        run: pytest --cov=src --cov-report=json:coverage_main.json

      - name: Compare coverage with main
        run: |
          python - <<'EOF'
          import json
          import sys

          with open("coverage.json") as f:
              pr = json.load(f)

          with open("../main-worktree/coverage_main.json") as f:
              main = json.load(f)

          pr_cov = pr["totals"]["percent_covered"]
          main_cov = main["totals"]["percent_covered"]

          pr_bp = int(round(pr_cov * 100))
          main_bp = int(round(main_cov * 100))

          print(f"PR coverage: {pr_bp/100:.2f}%")
          print(f"Main coverage: {main_bp/100:.2f}%")

          if pr_bp < main_bp:
              print("Coverage decreased compared to main")
              sys.exit(1)
          print("Coverage OK (not lower than main)")
          EOF
